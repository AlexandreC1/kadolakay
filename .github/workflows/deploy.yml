name: Deploy verified release
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, production]
permissions:
  contents: read
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Pull target environment
        run: npx vercel env pull .env.release.local --environment=${{ inputs.environment == 'production' && 'production' || 'preview' }} --yes --token "$VERCEL_TOKEN"
      - name: Check required configuration
        run: node --env-file=.env.release.local scripts/check-release-env.mjs ${{ inputs.environment == 'staging' && '--staging' || '' }}
      - name: Apply committed migrations
        run: node --env-file=.env.release.local scripts/run-migrations.mjs
      - name: Deploy target
        run: npx vercel deploy --yes --token "$VERCEL_TOKEN" ${{ inputs.environment == 'production' && '--prod' || '' }}
