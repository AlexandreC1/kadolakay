# =============================================================================
# CI Pipeline — KadoLakay
# =============================================================================
# Jobs (all must pass before merge; configure them as required checks):
#
#   lint ─┐
#   typecheck ─┼─► build
#   test ─┘
#   audit        npm audit (production deps), fails on high/critical
#   migrations   applies every migration to a fresh Postgres, checks schema drift
#   ownership    PRs from ws<N>/* may only touch files that workstream owns
#
# Installs use `npm ci` against the committed package-lock.json, so every job
# runs the exact dependency tree that was reviewed. The lockfile is generated
# with npm 9+ and lists all platform-specific optional binaries (swc, rollup,
# sharp), so it works on Linux CI, macOS and Windows alike. If `npm ci`
# reports the lockfile is out of sync, run `npm install` locally and commit.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: "Type Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Run TypeScript compiler
        run: npx tsc --noEmit

  test:
    name: "Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Run unit tests
        run: npm test

  # Production dependency audit. Dev-only advisories (vitest, eslint-config-next)
  # are reported but don't fail the build; see the second step.
  audit:
    name: "Dependency Audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Audit production dependencies (fail on high)
        run: npm audit --omit=dev --audit-level=high
      - name: Report dev dependency advisories (non-blocking)
        run: npm audit --audit-level=critical || true

  migrations:
    name: "Migrations"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kadolakay_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kadolakay_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate schema
        run: npx prisma validate
      - name: Apply all migrations to an empty database
        run: npx prisma migrate deploy
      - name: Fail if schema.prisma and migrations have drifted
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Seed runs against the migrated schema
        run: npx tsx prisma/seed.ts

  ownership:
    name: "Workstream Ownership"
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ownership-override')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check changed files against .github/ownership.json
        env:
          OWNERSHIP_BASE: origin/${{ github.base_ref }}
        run: npx tsx scripts/check-ownership.ts "${{ github.head_ref }}"

  build:
    name: "Build"
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    env:
      DATABASE_URL: "postgresql://fake:fake@localhost:5432/fake"
      AUTH_SECRET: "ci-secret-not-real"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Build application
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: nextjs-build
          path: .next/
          retention-days: 7
