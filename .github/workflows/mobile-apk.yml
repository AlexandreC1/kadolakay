name: Mobile demo APK
# Builds the Expo app in mobile/ into an installable Android APK and publishes it
# on the "mobile-demo" pre-release, so the download link stays the same:
# https://github.com/AlexandreC1/kadolakay/releases/download/mobile-demo/bayou-demo.apk
# The app runs on fictional demo data and is signed with the debug key: fine for
# sideloading to testers, not for Google Play (use EAS or an upload key for that).
on:
  push:
    branches: [claude/mobile-app]
    paths: ["mobile/**", "src/lib/**", ".github/workflows/mobile-apk.yml"]
  workflow_dispatch:
concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --no-audit --no-fund
      - name: Check before building
        run: |
          npx tsc --noEmit
          npx vitest run
      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install --clean
        env:
          EXPO_NO_TELEMETRY: "1"
      - name: Build the release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
        env:
          NODE_ENV: production
      - name: Collect the APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk bayou-demo.apk
          ls -la bayou-demo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bayou-demo-apk
          path: mobile/bayou-demo.apk
          retention-days: 30
      - name: Publish on the mobile-demo pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mobile-demo --yes --cleanup-tag || true
          gh release create mobile-demo bayou-demo.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Bayou demo app (Android)" \
            --notes "Demo build of the Bayou mobile app from ${GITHUB_SHA::7}. Sample lists and shops only; no account or payment is real. Install: open this page on an Android phone, download bayou-demo.apk, then allow installing from this source when Android asks."
